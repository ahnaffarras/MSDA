# Override untuk PENGEMBANGAN LOKAL: membuka port layanan internal, hanya di 127.0.0.1.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Jangan dipakai di server produksi.
services:
  mongo:
    ports:
      - "127.0.0.1:27017:27017"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  backend:
    ports:
      - "127.0.0.1:8081:8080"
