# MSDA — Docker Compose
#
# Port yang dipublikasikan ke host HANYA:
#   3000  dashboard           (akses pengguna)
#   5678  n8n                 (sebaiknya di belakang reverse proxy + autentikasi)
#   514   vector (udp/tcp)    (syslog dari MikroTik)
#   8686  vector API          (hanya 127.0.0.1)
#   53    adguard (tcp/udp)   (HANYA bila --profile enforcement; di-bind ke ${MSDA_HOST_IP})
# MongoDB, Redis, dan backend TIDAK terbuka dari host; antar-layanan bicara lewat
# jaringan Docker (mongo, redis, backend:8080). Untuk pengembangan lokal pakai:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Secret WAJIB diisi di .env (lihat .env.example). Tanpa nilai, `docker compose up`
# berhenti dengan pesan yang jelas — tidak ada lagi nilai default yang berbahaya.

services:
  mongo:
    image: mongo:4.4
    container_name: msda-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-msda}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (openssl rand -hex 16)}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # mongo:4.4 memakai shell `mongo` (bukan `mongosh`)
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: msda-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: msda-n8n
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      DB_TYPE: sqlite
      # Jangan diganti bila n8n sudah menyimpan kredensial: kunci baru membuat kredensial lama tak terbaca.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 16). If n8n already has credentials, keep the value used before.}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 72
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n-data:/home/node/.n8n

  vector:
    image: timberio/vector:0.38.0-debian
    container_name: msda-vector
    restart: unless-stopped
    ports:
      - "514:514/udp"
      - "514:514/tcp"
      - "127.0.0.1:8686:8686"
    environment:
      - VECTOR_N8N_WEBHOOK_URL=http://n8n:5678/webhook/dns-scan-webhook
      - MSDA_WEBHOOK_TOKEN=${MSDA_WEBHOOK_TOKEN:?Set MSDA_WEBHOOK_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      - ../log-parser/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
    command: ["--config", "/etc/vector/vector.toml"]

  # Backup MongoDB terjadwal (mongodump → volume backup-data). Panduan restore: docs/backup-restore.md
  backup:
    image: mongo:4.4
    container_name: msda-backup
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-msda}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/?authSource=admin
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../backup/backup.sh:/backup.sh:ro
      - backup-data:/backups
    healthcheck:
      test: ["CMD", "/bin/bash", "/backup.sh", "--healthcheck"]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 30m

  # ── DNS Enforcement (OPSIONAL) ───────────────────────────────────────────
  # Hanya berjalan dengan:  docker compose --profile enforcement up -d
  # Tanpa profile ini service di bawah diabaikan dan MSDA berjalan seperti biasa.
  # Panduan: docs/adguard.md. Konfigurasi awal: infrastructure/adguard/init.sh
  adguard:
    # Versi DIPIN (bukan latest). Naikkan hanya setelah memeriksa openapi.yaml versi baru.
    image: adguard/adguardhome:v0.107.79
    container_name: msda-adguard
    profiles: ["enforcement"]
    restart: unless-stopped
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
    ports:
      # DNS: HANYA di IP LAN host (jangan 0.0.0.0, jangan ke internet = open resolver).
      # Default 127.0.0.1 supaya aman bila MSDA_HOST_IP lupa diisi.
      - "${MSDA_HOST_IP:-127.0.0.1}:53:53/tcp"
      - "${MSDA_HOST_IP:-127.0.0.1}:53:53/udp"
      # UI admin: hanya loopback host (untuk wizard / init awal). Backend memakai http://adguard:3000.
      - "127.0.0.1:${ADGUARD_UI_PORT:-3000}:3000/tcp"
    healthcheck:
      # Bekerja baik pada mode wizard (belum diinisialisasi) maupun sesudahnya.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ../../services/msda-backend
      dockerfile: Dockerfile
    container_name: msda-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Tanpa `ports`: hanya dashboard dan n8n yang boleh memanggil backend (lewat jaringan Docker).
    environment:
      APP_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-msda}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGODB_DB:-msda}?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-msda}
      REDIS_URL: redis://redis:6379
      # Dikirim n8n pada header X-MSDA-Token
      MSDA_WEBHOOK_TOKEN: ${MSDA_WEBHOOK_TOKEN:?Set MSDA_WEBHOOK_TOKEN in .env (openssl rand -hex 32)}
      # Dikirim dashboard pada header X-Internal-Token (harus beda dari webhook token)
      MSDA_INTERNAL_TOKEN: ${MSDA_INTERNAL_TOKEN:?Set MSDA_INTERNAL_TOKEN in .env (openssl rand -hex 32)}
      # DNS Enforcement (opsional; default mati → perilaku identik dengan sebelumnya)
      MSDA_ENFORCEMENT_ENABLED: ${MSDA_ENFORCEMENT_ENABLED:-false}
      ADGUARD_URL: ${ADGUARD_URL:-http://adguard:3000}
      ADGUARD_USER: ${ADGUARD_USER:-}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-}
      ADGUARD_BLOCKING_MODE: ${ADGUARD_BLOCKING_MODE:-null_ip}
      ADGUARD_SYNC_INTERVAL: ${ADGUARD_SYNC_INTERVAL:-5m}
      MSDA_NEVER_BLOCK: ${MSDA_NEVER_BLOCK:-}

  dashboard:
    build:
      context: ../../services/dashboard
      dockerfile: Dockerfile
    container_name: msda-dashboard
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-msda}:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}@mongo:27017/${MONGODB_DB:-msda}?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-msda}
      # Dibaca saat runtime oleh proxy /api-proxy (bukan lagi dikunci saat build)
      MSDA_BACKEND_URL: http://backend:8080
      MSDA_INTERNAL_TOKEN: ${MSDA_INTERNAL_TOKEN:?Set MSDA_INTERNAL_TOKEN in .env (openssl rand -hex 32)}
      # Opsional: webhook n8n untuk tombol "Send test" di Notification settings
      N8N_TEST_NOTIFY_URL: ${N8N_TEST_NOTIFY_URL:-}
      # Kunci HMAC untuk penyamaran IP klien bagi viewer (default: MSDA_INTERNAL_TOKEN)
      MSDA_PRIVACY_KEY: ${MSDA_PRIVACY_KEY:-}
      MSDA_WEBHOOK_TOKEN: ${MSDA_WEBHOOK_TOKEN:-}
      MSDA_BOOTSTRAP_ADMIN_USER: ${MSDA_BOOTSTRAP_ADMIN_USER:-admin}
      MSDA_BOOTSTRAP_ADMIN_PASSWORD: ${MSDA_BOOTSTRAP_ADMIN_PASSWORD:-}
      MSDA_SESSION_HOURS: ${MSDA_SESSION_HOURS:-12}
      MSDA_COOKIE_SECURE: ${MSDA_COOKIE_SECURE:-}
      MSDA_ALLOWED_ORIGINS: ${MSDA_ALLOWED_ORIGINS:-}
      # Daftar never-block (hanya dibaca untuk validasi awal & tampilan; backend tetap otoritatif)
      MSDA_NEVER_BLOCK: ${MSDA_NEVER_BLOCK:-}

volumes:
  mongo-data:
  n8n-data:
  vector-data:
  redis-data:
  backup-data:
  adguard-work:
  adguard-conf:
