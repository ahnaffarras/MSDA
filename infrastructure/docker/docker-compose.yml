services:
  mongo:
    image: mongo:7.0
    container_name: sata-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-sata}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-sata123}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  n8n:
    image: n8nio/n8n:latest
    container_name: sata-n8n
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: production
      DB_TYPE: sqlite
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-changeme}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Asia/Jakarta
    volumes:
      - n8n-data:/home/node/.n8n

  redis:
    image: redis:7.2-alpine
    container_name: sata-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  vector:
    image: timberio/vector:0.38.0-debian
    container_name: sata-vector
    restart: unless-stopped
    ports:
      - "514:514/udp"
      - "514:514/tcp"
      - "8686:8686"
    environment:
      - VECTOR_N8N_WEBHOOK_URL=http://n8n:5678/webhook/sata-dns
      - SATA_WEBHOOK_TOKEN=${SATA_WEBHOOK_TOKEN:-changeme-token}
    volumes:
      - ../log-parser/vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
    command: ["--config", "/etc/vector/vector.toml"]

  backend:
    build:
      context: ../../services/sata-ai-backend
      dockerfile: Dockerfile
    container_name: sata-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    ports:
      - "8081:8080"
    environment:
      APP_ENV: production
      PORT: 8080
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-sata}:${MONGO_ROOT_PASSWORD:-sata123}@mongo:27017/sata?authSource=admin
      MONGODB_DB: sata
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret}
      SATA_WEBHOOK_TOKEN: ${SATA_WEBHOOK_TOKEN:-changeme-token}
      ALLOWED_ORIGINS: http://localhost:3000

  dashboard:
    build:
      context: ../../services/dashboard
      dockerfile: Dockerfile
    container_name: sata-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-sata}:${MONGO_ROOT_PASSWORD:-sata123}@mongo:27017/sata?authSource=admin
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_BASE_URL: http://dashboard:3000
      NEXT_PUBLIC_WS_URL: ws://backend:8080

volumes:
  mongo-data:
  n8n-data:
  vector-data:
  redis-data: